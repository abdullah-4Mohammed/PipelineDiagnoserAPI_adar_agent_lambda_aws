<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Diagnoser</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#677089; --line:#e2e5eb; --accent:#1f6feb; --err:#c62828; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --text:#e6e9ef; --muted:#9aa3b5; --line:#2a303c; --accent:#4c8dff; --err:#ff6b6b; } }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    main { max-width:760px; margin:0 auto; padding:32px 16px 48px; }
    h1 { font-size:1.6rem; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
    label { display:block; font-weight:600; font-size:.9rem; margin-bottom:6px; }
    textarea, input, select { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    textarea { min-height:180px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:.9rem; }
    .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .row > div { flex:1 1 220px; }
    button { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .err { color:var(--err); font-weight:600; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
    .stat { border:1px solid var(--line); border-radius:10px; padding:12px; }
    .stat b { display:block; font-size:1.5rem; }
    .stat span, .muted { color:var(--muted); font-size:.85rem; }
    h2 { font-size:1rem; margin:18px 0 8px; }
    ol, ul { margin:0; padding-left:20px; }
    pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; font-size:.85rem; white-space:pre-wrap; }
    .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.8rem; font-weight:700; border:1px solid currentColor; }
    .diff .add { color:#2e7d32; } .diff .del { color:var(--err); } .diff .hunk { color:var(--muted); }
    .actions button { margin-right:8px; } .reject { background:transparent; color:var(--err); border:1px solid var(--err); }
    .high { color:#2e7d32; } .medium { color:#b26a00; } .low { color:var(--err); }
  </style>
</head>
<body>
<main>
  <h1>Pipeline Diagnoser</h1>
  <p class="sub">Diagnose a failed Azure DevOps run by its ID or pipeline name, or paste any failed CI/CD, Terraform or Kubernetes log. Secrets, account IDs, IPs and emails are masked before analysis.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="key">API key</label>
        <input id="key" type="password" placeholder="x-api-key" autocomplete="off">
      </div>
      <div>
        <label for="mode">Input</label>
        <select id="mode">
          <option value="ado">From Azure DevOps</option>
          <option value="fix">Auto-fix (Azure DevOps)</option>
          <option value="paste">Paste a log</option>
        </select>
      </div>
    </div>

    <div id="adoBox">
      <label for="target">Run ID or pipeline name</label>
      <input id="target" placeholder="e.g. 652, or infra-my-pipeline for its latest failed run">
    </div>

    <div id="pasteBox" hidden>
      <div class="row">
        <div>
          <label for="source">Log source</label>
          <select id="source">
            <option value="azure devops pipeline">Azure DevOps pipeline</option>
            <option value="terraform">Terraform</option>
            <option value="kubernetes">Kubernetes / kubectl</option>
            <option value="github actions">GitHub Actions</option>
            <option value="docker build">Docker build</option>
          </select>
        </div>
      </div>
      <label for="log">Failed log</label>
      <textarea id="log" placeholder="Paste the failed log here..."></textarea>
    </div>
    <button id="go">Diagnose</button>
  </div>

  <div class="card" id="out" hidden></div>
</main>
<script>
  // filled in by the pipeline at deploy time (replacetokens)
  var API_URL = "__apiUrl__";

  var out = document.getElementById("out");
  var btn = document.getElementById("go");
  var keyBox = document.getElementById("key");
  var mode = document.getElementById("mode");

  mode.onchange = function () {
    document.getElementById("adoBox").hidden = mode.value === "paste";
    btn.textContent = mode.value === "fix" ? "Start auto-fix" : "Diagnose";
    document.getElementById("pasteBox").hidden = mode.value !== "paste";
  };

  function requestBody() {
    if (mode.value === "paste") {
      return { log: document.getElementById("log").value, source: document.getElementById("source").value };
    }
    var t = document.getElementById("target").value.trim();
    return /^\d+$/.test(t) ? { runId: Number(t) } : { pipeline: t };
  }

  // keep the key for this browser tab only
  try { keyBox.value = sessionStorage.getItem("apiKey") || ""; } catch (e) {}

  function esc(s) { var d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }

  btn.onclick = function () {
    try { sessionStorage.setItem("apiKey", keyBox.value); } catch (e) {}
    if (mode.value === "fix") { startFix(); return; }
    btn.disabled = true; btn.textContent = "Diagnosing...";
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": keyBox.value },
      body: JSON.stringify(requestBody())
    })
      .then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); })
      .then(function (res) {
        var status = res[0], d = res[1];
        out.hidden = false;
        if (status === 403) { out.innerHTML = '<p class="err">API key missing or wrong.</p>'; return; }
        if (status === 429) { out.innerHTML = '<p class="err">Daily limit reached, try again later.</p>'; return; }
        if (d.error || d.message) { out.innerHTML = '<p class="err">' + esc(d.error || d.message) + '</p>'; return; }
        var conf = String(d.confidence || "").toLowerCase();
        var html = '';
        if (d.run) {
          html += '<p class="muted">Run ' + esc(d.run.id) + ' · ' + esc(d.run.pipeline) + ' · failed: ' + esc(d.run.failedSteps.join(", ")) + '</p>';
        }
        html += '<p><span class="badge ' + esc(conf) + '">confidence: ' + esc(conf) + '</span></p>';
        html += '<h2>Root cause</h2><p>' + esc(d.rootCause) + '</p>';
        html += '<h2>Failed step</h2><p>' + esc(d.failedStep) + '</p>';
        html += '<h2>Fix</h2><ol>' + (d.fix || []).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join("") + '</ol>';
        if (d.codeSnippet) { html += '<h2>Suggested change</h2><pre>' + esc(d.codeSnippet) + '</pre>'; }
        var masked = Object.keys(d.masked || {}).map(function (k) { return d.masked[k] + " " + k.toLowerCase(); }).join(", ");
        html += '<p class="muted">Masked before analysis: ' + esc(masked || "nothing") + (d.logTruncated ? " · log truncated to the last part" : "") + ' · model: ' + esc(d.model) + '</p>';
        out.innerHTML = html;
      })
      .catch(function () { out.hidden = false; out.innerHTML = '<p class="err">Could not reach the API.</p>'; })
      .finally(function () { btn.disabled = false; btn.textContent = "Diagnose"; });
  };

  // ---------- auto-fix: start, poll status, approve / reject ----------
  var BASE_URL = API_URL.replace(/\/diagnose$/, "");
  var pollTimer = null;
  var STATUS_TEXT = {
    started: "Starting...", diagnosing: "Reading the run and the repo, diagnosing...",
    proposed: "Fix proposed, preparing approval...", waiting_approval: "Waiting for your approval",
    approved: "Approved, pushing the change...", rejecting: "Rejecting...", pushed: "Pushed, starting the pipeline...",
    running_staging: "Deploying to staging, checking every minute...", green_staging: "Staging is green",
    running_prod: "Deploying to prod, checking every minute...", green_prod: "Prod is green",
    failed_again: "Deploy failed, diagnosing the new failure...",
    green: "Done: fix is green on staging and prod", green_branch: "Green on the branch (branches never deploy to prod)", prod_rejected: "Live on staging, not deployed to prod", rejected: "Rejected, nothing was pushed", gave_up: "Stopped after the maximum attempts",
    expired: "No approval in time, nothing was pushed", no_fix: "No fix proposed", error: "Agent error"
  };

  function api(method, path, body) {
    return fetch(BASE_URL + path, {
      method: method,
      headers: { "Content-Type": "application/json", "x-api-key": keyBox.value },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); });
  }

  function renderDiff(diff) {
    return '<pre class="diff">' + String(diff || "").split("\n").map(function (l) {
      var c = l.indexOf("@@") === 0 ? "hunk" : (l[0] === "+" && l.indexOf("+++") !== 0) ? "add" : (l[0] === "-" && l.indexOf("---") !== 0) ? "del" : "";
      return '<span class="' + c + '">' + esc(l) + '</span>';
    }).join("\n") + '</pre>';
  }

  function renderFix(f) {
    var html = '<p><b>' + esc(STATUS_TEXT[f.status] || f.status) + '</b>' + (f.attempt ? ' <span class="muted">· attempt ' + esc(f.attempt) + '</span>' : '') + '</p>';
    html += '<p class="muted">Run ' + esc(f.runId) + (f.pipeline ? ' · ' + esc(f.pipeline) : '') + (f.failedSteps ? ' · failed: ' + esc(f.failedSteps.join(", ")) : '') + '</p>';
    if (f.rootCause) { html += '<h2>Root cause</h2><p>' + esc(f.rootCause) + '</p>'; }
    if (f.summary) { html += '<h2>Proposed change <span class="badge ' + esc(f.confidence) + '">' + esc(f.confidence) + '</span></h2><p>' + esc(f.summary) + ' <span class="muted">(' + esc(f.file) + ')</span></p>' + renderDiff(f.diff); }
    if (f.status === "waiting_approval") {
      var promote = f.approvalType === "promote";
      if (promote) { html += '<p><b>Staging is green (run ' + esc(f.stagingRunId) + '). Deploy this change to prod?</b></p>'; }
      html += '<div class="actions"><button onclick="decide(\'approve\')">' + (promote ? 'Approve deploy to prod' : 'Approve and push') + '</button><button class="reject" onclick="decide(\'reject\')">Reject</button></div>';
    }
    if (f.commit) {
      html += '<p class="muted">Commit ' + esc(String(f.commit).slice(0, 7)) +
        (f.stagingRunId ? ' · staging run ' + esc(f.stagingRunId) : '') +
        (f.prodRunId ? ' · prod run ' + esc(f.prodRunId) : '') + '</p>';
    }
    if (f.reason) { html += '<p class="muted">' + esc(f.reason) + '</p>'; }
    out.hidden = false;
    out.innerHTML = html;
  }

  var FINAL = ["green", "green_branch", "rejected", "prod_rejected", "gave_up", "expired", "no_fix", "error"];
  var currentFix = null;
  var lastStatus = null;

  // every status check is one api call against the daily quota, so poll
  // slowly: the agent only changes state every few seconds to a minute
  var SLOW = ["running_staging", "running_prod", "waiting_approval"];
  var FAST_MS = 10000, SLOW_MS = 30000, MAX_ERRORS = 5;
  var errorCount = 0;

  function nextDelay(status) {
    return SLOW.indexOf(status) === -1 ? FAST_MS : SLOW_MS;
  }

  function schedule(ms) {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, ms);
  }

  function poll() {
    // no calls while the tab is hidden; resumes when it becomes visible again
    if (document.hidden) { return; }
    api("GET", "/autofix/" + currentFix).then(function (res) {
      if (res[0] !== 200) {
        var msg = res[0] === 429 ? "Daily API quota reached. Try again tomorrow." : (res[1].error || res[1].message || "Error");
        out.innerHTML = '<p class="err">' + esc(msg) + '</p>';
        btn.disabled = false; btn.textContent = "Start auto-fix";
        return;
      }
      errorCount = 0;
      lastStatus = res[1].status;
      renderFix(res[1]);
      if (FINAL.indexOf(res[1].status) === -1) { schedule(nextDelay(res[1].status)); }
      else { btn.disabled = false; btn.textContent = "Start auto-fix"; }
    }).catch(function () {
      errorCount += 1;
      if (errorCount >= MAX_ERRORS) {
        out.innerHTML = '<p class="err">Lost contact with the API. Reload the page to continue.</p>';
        btn.disabled = false; btn.textContent = "Start auto-fix";
        return;
      }
      schedule(SLOW_MS * errorCount);
    });
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && currentFix && FINAL.indexOf(lastStatus) === -1) { schedule(0); }
  });

  function startFix() {
    clearTimeout(pollTimer);
    btn.disabled = true; btn.textContent = "Working...";
    api("POST", "/autofix", requestBody()).then(function (res) {
      if (res[0] === 403) { out.hidden = false; out.innerHTML = '<p class="err">API key missing or wrong.</p>'; btn.disabled = false; btn.textContent = "Start auto-fix"; return; }
      if (!res[1].id) { out.hidden = false; out.innerHTML = '<p class="err">' + esc(res[1].error || res[1].message || "Could not start") + '</p>'; btn.disabled = false; btn.textContent = "Start auto-fix"; return; }
      currentFix = res[1].id; lastStatus = null; errorCount = 0;
      out.hidden = false; out.innerHTML = '<p><b>Starting...</b></p>';
      poll();
    }).catch(function () {
      out.hidden = false; out.innerHTML = '<p class="err">Could not reach the API. Check the API key and try again.</p>';
      btn.disabled = false; btn.textContent = "Start auto-fix";
    });
  }

  window.decide = function (decision) {
    api("POST", "/autofix/" + currentFix + "/decision", { decision: decision }).then(function () {
      clearTimeout(pollTimer); poll();
    });
  };
</script>
</body>
</html>
