<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Diagnoser</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#677089; --line:#e2e5eb; --accent:#1f6feb; --err:#c62828; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --text:#e6e9ef; --muted:#9aa3b5; --line:#2a303c; --accent:#4c8dff; --err:#ff6b6b; } }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    main { max-width:760px; margin:0 auto; padding:32px 16px 48px; }
    h1 { font-size:1.6rem; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
    label { display:block; font-weight:600; font-size:.9rem; margin-bottom:6px; }
    textarea, input, select { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    textarea { min-height:180px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:.9rem; }
    .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .row > div { flex:1 1 220px; }
    button { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .err { color:var(--err); font-weight:600; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
    .stat { border:1px solid var(--line); border-radius:10px; padding:12px; }
    .stat b { display:block; font-size:1.5rem; }
    .stat span, .muted { color:var(--muted); font-size:.85rem; }
    h2 { font-size:1rem; margin:18px 0 8px; }
    ol, ul { margin:0; padding-left:20px; }
    pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; font-size:.85rem; white-space:pre-wrap; }
    .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.8rem; font-weight:700; border:1px solid currentColor; }
    .high { color:#2e7d32; } .medium { color:#b26a00; } .low { color:var(--err); }
  </style>
</head>
<body>
<main>
  <h1>Pipeline Diagnoser</h1>
  <p class="sub">Paste a failed CI/CD, Terraform or Kubernetes log. Secrets, account IDs, IPs and emails are masked before analysis.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="key">API key</label>
        <input id="key" type="password" placeholder="x-api-key" autocomplete="off">
      </div>
      <div>
        <label for="source">Log source</label>
        <select id="source">
          <option value="azure devops pipeline">Azure DevOps pipeline</option>
          <option value="terraform">Terraform</option>
          <option value="kubernetes">Kubernetes / kubectl</option>
          <option value="github actions">GitHub Actions</option>
          <option value="docker build">Docker build</option>
        </select>
      </div>
    </div>
    <label for="log">Failed log</label>
    <textarea id="log" placeholder="Paste the failed log here..."></textarea>
    <button id="go">Diagnose</button>
  </div>

  <div class="card" id="out" hidden></div>
</main>
<script>
  // filled in by terraform at deploy time
  var API_URL = "${api_url}";

  var out = document.getElementById("out");
  var btn = document.getElementById("go");
  var keyBox = document.getElementById("key");

  // keep the key for this browser tab only
  try { keyBox.value = sessionStorage.getItem("apiKey") || ""; } catch (e) {}

  function esc(s) { var d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }

  btn.onclick = function () {
    try { sessionStorage.setItem("apiKey", keyBox.value); } catch (e) {}
    btn.disabled = true; btn.textContent = "Diagnosing...";
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": keyBox.value },
      body: JSON.stringify({ log: document.getElementById("log").value, source: document.getElementById("source").value })
    })
      .then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); })
      .then(function (res) {
        var status = res[0], d = res[1];
        out.hidden = false;
        if (status === 403) { out.innerHTML = '<p class="err">API key missing or wrong.</p>'; return; }
        if (status === 429) { out.innerHTML = '<p class="err">Daily limit reached, try again later.</p>'; return; }
        if (d.error || d.message) { out.innerHTML = '<p class="err">' + esc(d.error || d.message) + '</p>'; return; }
        var conf = String(d.confidence || "").toLowerCase();
        var html = '<p><span class="badge ' + esc(conf) + '">confidence: ' + esc(conf) + '</span></p>';
        html += '<h2>Root cause</h2><p>' + esc(d.rootCause) + '</p>';
        html += '<h2>Failed step</h2><p>' + esc(d.failedStep) + '</p>';
        html += '<h2>Fix</h2><ol>' + (d.fix || []).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join("") + '</ol>';
        if (d.codeSnippet) { html += '<h2>Suggested change</h2><pre>' + esc(d.codeSnippet) + '</pre>'; }
        var masked = Object.keys(d.masked || {}).map(function (k) { return d.masked[k] + " " + k.toLowerCase(); }).join(", ");
        html += '<p class="muted">Masked before analysis: ' + esc(masked || "nothing") + (d.logTruncated ? " · log truncated to the last part" : "") + ' · model: ' + esc(d.model) + '</p>';
        out.innerHTML = html;
      })
      .catch(function () { out.hidden = false; out.innerHTML = '<p class="err">Could not reach the API.</p>'; })
      .finally(function () { btn.disabled = false; btn.textContent = "Diagnose"; });
  };
</script>
</body>
</html>
