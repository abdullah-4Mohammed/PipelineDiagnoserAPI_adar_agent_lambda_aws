name: $(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)
#go
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - cicd
    - deploy
    - src

pool: 
  vmImage: 'ubuntu-latest'

resources:
- repo: self

variables:
- template: variables/vars-global.yaml

parameters:
- name: environments
  type: object
  default: ['nonprod']
# - name: namespaces
#   type: object
#   default: ['dev']

stages:
- ${{ each env in parameters.environments }}:
  - stage: Deploy_${{ env }}
    displayName: Deploy ${{ env }}
    jobs:
    - job: Deploy_Terraform
      displayName: Deploy terraform infrastructure
      #condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      variables:
      - template: variables/vars-${{ env }}.yaml
      steps:
      - template: templates/steps-deploy-tf.yaml

    - job: Deploy_WebApp
      displayName: Deploy web page
      dependsOn: Deploy_Terraform
      variables:
      - template: variables/vars-${{ env }}.yaml
      - name: apiUrl
        value: $[ dependencies.Deploy_Terraform.outputs['tfOutputs.apiUrl'] ]
      - name: webBucket
        value: $[ dependencies.Deploy_Terraform.outputs['tfOutputs.webBucket'] ]
      - name: webDistributionId
        value: $[ dependencies.Deploy_Terraform.outputs['tfOutputs.webDistributionId'] ]
      steps:
      - template: templates/steps-deploy-webapp.yaml
